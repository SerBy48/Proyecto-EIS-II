openapi: 3.0.3
info:
  title: Plataforma de comercio electronico - API publica
  version: 1.0.0
  description: |
    API publica del **API Gateway**, la unica puerta de entrada de la plataforma
    (docs/adr/0008-openapi-centralizada-gateway.md).

    - **Autenticacion:** `Authorization: Bearer <jwt>` en todas las rutas salvo las
      marcadas sin candado. El JWT dura 15 minutos; se renueva con `/api/auth/renovar`.
    - **Roles:** la extension `x-roles` de cada operacion dice quien puede usarla:
      `publica`, `sesion` (cualquier usuario autenticado, con autorizacion a nivel de
      dato) o los roles concretos. `npm run test:openapi` la contrasta con el codigo.
    - **Errores:** siempre `{ mensaje, codigo }`.
    - **Limites:** 300 peticiones/min por usuario o IP, 10 logins cada 15 min y 10
      checkouts por minuto.
    - **Cuentas de prueba:** `ana@correo.co` (cliente 1), `vendedor@tienda.co`,
      `admin@tienda.co`; contrasena `Password123`.

    Las rutas internas de la saga estan en `openapi-interna.yaml`, que no se publica.
  contact:
    name: Repositorio del proyecto
    url: https://github.com/SerBy48/Proyecto-EIS-II
servers:
  - url: /
    description: El mismo gateway que sirve esta documentacion
  - url: http://localhost:8080
    description: Gateway local
security:
  - bearerAuth: []
tags:
  - { name: plataforma, description: Salud agregada }
  - { name: auth, description: 'Cuentas, sesiones y usuarios internos' }
  - { name: clientes, description: 'Perfiles, direcciones e historial' }
  - { name: catalogo, description: 'Productos, categorias y cupones' }
  - { name: inventario, description: 'Stock, movimientos y alertas' }
  - { name: carrito, description: Carrito con TTL y cupones }
  - { name: pedidos, description: Checkout (saga) y ciclo de vida del pedido }
  - { name: pagos, description: Transacciones sin datos de tarjeta }
  - { name: notificaciones, description: Avisos enviados y plantillas }
  - { name: asistente, description: 'Asistente virtual: chat, tickets y edicion de intenciones y FAQ' }

