# ============================================================================
# Despliegue en la NUBE: una maquina virtual con Docker (Azure u Oracle Cloud;
# docs/manuales/DESPLIEGUE.md y docs/adr/0010). Se aplica encima del perfil de
# produccion:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.nube.yml up -d --build --wait
#
# Agrega Caddy en los puertos 80 y 443 con HTTPS automatico para DOMINIO, y
# deja la web solo en 127.0.0.1:8081 (antes la publicaba en todas las
# interfaces; Docker se salta el firewall del sistema operativo).
# ============================================================================

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: ecom_caddy
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env (por ejemplo serbytek.eastus2.cloudapp.azure.com)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados: se conservan entre reinicios (sin esto, se pediria uno
      # nuevo cada vez y se alcanzaria el limite de Let's Encrypt).
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
    networks: [interna]

  web:
    ports: !override
      - "127.0.0.1:${WEB_PUERTO:-8081}:8080"

  api-gateway:
    environment:
      # Caddy y nginx delante: la IP de cada persona para el limite de peticiones.
      PROXIES_CONFIANZA: "2"
      CORS_ORIGENES: https://${DOMINIO}

volumes:
  caddy_datos:
  caddy_config:
