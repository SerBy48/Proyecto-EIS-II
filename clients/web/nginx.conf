# ============================================================================
# nginx de la web (Trabajo Final, Fase 5; docs/adr/0009).
#
# - Sirve el build de Vite (SPA: toda ruta desconocida vuelve a index.html).
# - Proxy inverso de /api al gateway: la web y la API comparten origen. Una
#   peticion del mismo origen se reenvia SIN la cabecera Origin (ver el map
#   $origen_hacia_gateway); asi funciona con cualquier nombre (localhost, el
#   tunel de la defensa) sin listarlo en CORS_ORIGENES.
# - Cabeceras de seguridad: las MISMAS de clients/web/cabeceras-seguridad.js
#   (hallazgo S-08). Solo en las respuestas de la web; las de /api conservan
#   las del gateway (Swagger UI lleva su propia CSP).
# - gzip y cache larga para los recursos con hash del build.
# ============================================================================

# Docker resuelve "api-gateway" en la red interna; con la variable, nginx
# re-resuelve el nombre si el contenedor del gateway se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $conexion_upgrade {
  default upgrade;
  '' close;
}

# Mismo origen: el Origin del navegador coincide con el Host de la peticion
# (ignorando el esquema: el tunel termina TLS y llega por http). En ese caso no
# es una peticion entre sitios y la cabecera se quita; si viene de OTRO sitio
# se reenvia tal cual y el gateway aplica su lista CORS_ORIGENES.
map "$http_origin#$http_host" $origen_hacia_gateway {
  default $http_origin;
  "~^https?://(?<origen>[^#/]+)#\k<origen>$" "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ---------------------------------------------------------------- API
  location /api/ {
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Origin $origen_hacia_gateway;
    # Un poco mas que el proxyTimeout del gateway (15 s): el 504 lo da el gateway.
    proxy_read_timeout 20s;
  }

  # ----------------------------------------------------- recursos con hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/cabeceras-seguridad.conf;
  }

  # ------------------------------------------------------------------- SPA
  location / {
    try_files $uri $uri/ /index.html;
    # index.html nunca se cachea: siempre apunta a los recursos del ultimo build.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/cabeceras-seguridad.conf;
  }
}
